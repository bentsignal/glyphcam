[package]
name = "glyphcam"
description = "Real-time glyph-art face camera with a virtual webcam output"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
glyphcam-core.workspace = true
glyphcam-shm.workspace = true
anyhow.workspace = true
log.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "links", "clipboard"] }
tray-icon = "0.26"
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
zune-jpeg = "0.5"
zune-core = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
jpeg-encoder = "0.7"
ureq = { version = "3", features = ["json"] }
directories = "6"
semver = "1"
auto-launch = "0.6"
env_logger = "0.11"
if-addrs = "0.15"
arboard = { version = "3", default-features = false }
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_Media_MediaFoundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = "0.3"

[build-dependencies]
embed-resource = "3"
